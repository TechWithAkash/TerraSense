name: Keep backend awake

# Render's free tier spins the backend down after ~15 minutes with no traffic, and the first
# request after that has to wait for a fresh container to boot - sometimes 30-90+ seconds. An
# evaluator's very first message would hit that delay with no warning. Pinging the health check
# often enough that the backend never goes idle for 15 minutes avoids the problem entirely,
# instead of just handling it gracefully on the frontend.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: curl -sf --max-time 60 https://errasense-api.onrender.com/healthz || echo "ping failed or backend was cold - not treated as a workflow failure"
